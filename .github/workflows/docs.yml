name: Python API reference

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  docs:
    name: Build Python API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install SDK and documentation tools
        run: python -m pip install -e . -r docs/requirements.txt pytest pytest-asyncio
      - name: Build API reference
        run: scripts/build_api_docs.sh
      - name: Check public API pages
        run: pytest tests/docs/test_api_docs.py -v
      - name: Upload API reference
        uses: actions/upload-artifact@v4
        with:
          name: python-api-reference
          path: docs/api/
          if-no-files-found: error
